app:
  host: "127.0.0.1"
  port: 8000
  work_dir: "work"
  outputs_dir: "outputs"
  fonts_dir: "fonts"
  log_file: "app.log"

ingest:
  max_height: 1080
  audio_sample_rate: 16000
  audio_channels: 1

transcription:
  model: "small" # options: "base", "small", "medium"
  compute_type: "auto" # "auto" (int8 for CPU, float16 for CUDA)
  device: "auto" # "auto" (detects CUDA GPU on Colab, CPU locally), "cuda", "cpu"
  vad_filter: true
  beam_size: 1
  chunk_seconds: 300 # 5-minute parallel chunks for long audio
  workers: 2 # Number of parallel chunk workers

llm:
  provider: "gemini" # gemini, openai_compatible, ollama
  default_model: "gemini-2.5-flash"
  fallback_models: ["gemini-1.5-flash", "gemini-2.0-flash"]
  rpm_limit: 10
  max_retries: 5
  temperature: 0.3
  target_clips: 6
  min_clips: 5
  min_clip_duration: 20
  max_clip_duration: 60
  chunk_duration_minutes: 20

reframing:
  target_width: 1080
  target_height: 1920
  sample_fps: 1.5
  smoothing_window: 15
  max_pan_speed_px_per_sec: 250
  min_speaker_hold_sec: 2.0
  no_face_mode: "auto" # "auto", "center_crop", "blurred_fit"

rendering:
  preset: "ultrafast"
  fps: 30
  target_lufs: -14.0
  fade_duration: 0.3
  video_codec: "libx264"
  audio_codec: "aac"

